name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json's "packageManager" field.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Typecheck
        run: pnpm --filter @api-starter-kit/backend typecheck

      - name: Lint
        run: pnpm --filter @api-starter-kit/backend lint:check

      - name: Test
        run: pnpm --filter @api-starter-kit/backend test
        env:
          NODE_ENV: test
          TZ: Asia/Shanghai
          PORT: 3333
          HOST: 127.0.0.1
          LOG_LEVEL: silent
          APP_KEY: 0123456789abcdef0123456789abcdef
          APP_URL: http://127.0.0.1:3333
          SESSION_DRIVER: memory
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          DB_DATABASE: ci_db

  frontend:
    name: Frontend (type-check, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json's "packageManager" field.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Type-check
        run: pnpm --filter frontend type-check

      - name: Lint
        run: pnpm --filter frontend lint:check

      - name: Build
        run: pnpm --filter frontend build

  diff-check:
    name: Git diff --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for whitespace/conflict errors
        run: git diff --check origin/main...HEAD

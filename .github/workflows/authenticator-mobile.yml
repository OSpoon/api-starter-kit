name: Authenticator Mobile

on:
  push:
    paths:
      - apps/authenticator-mobile/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/authenticator-mobile.yml
  pull_request:
    paths:
      - apps/authenticator-mobile/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/authenticator-mobile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web app
        run: pnpm --filter @api-starter-kit/authenticator-mobile build

      - name: Sync Android project
        run: pnpm --dir apps/authenticator-mobile exec cap sync android

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: apps/authenticator-mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: authenticator-android-debug
          path: apps/authenticator-mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web app
        run: pnpm --filter @api-starter-kit/authenticator-mobile build

      - name: Sync iOS project
        run: pnpm --dir apps/authenticator-mobile exec cap sync ios

      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/authenticator-ios-deriveddata"
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: apps/authenticator-mobile

      - uses: actions/upload-artifact@v4
        with:
          name: authenticator-ios-simulator
          path: ${{ runner.temp }}/authenticator-ios-deriveddata/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

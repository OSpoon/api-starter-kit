services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:15
    env_file:
      - apps/backend/.env
    command:
      - sh
      - -c
      - export POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD" POSTGRES_DB="$$DB_DATABASE" && exec docker-entrypoint.sh postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$DB_USER" -d "$$DB_DATABASE"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    env_file:
      - apps/backend/.env
    environment:
      HOST: 0.0.0.0
      MIGRATE: 'true'
      NODE_ENV: production
      DB_HOST: postgres
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-ollama}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-http://ollama:11434/v1}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-llama3.2:1b}
    ports:
      - '${BACKEND_PORT:-13333}:13333'
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/api/v1/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    ports:
      - '${FRONTEND_PORT:-18080}:18080'
    env_file:
      - apps/frontend/.env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  ollama-data:

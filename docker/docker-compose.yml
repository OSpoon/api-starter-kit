services:
  postgres:
    image: pgvector/pgvector:pg15
    env_file:
      - ../apps/backend/.env
    command:
      - sh
      - -c
      - export POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD" POSTGRES_DB="$$DB_DATABASE" && exec docker-entrypoint.sh postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$DB_USER" -d "$$DB_DATABASE"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    env_file:
      - ../apps/backend/.env
    environment:
      HOST: 0.0.0.0
      MIGRATE: 'true'
      NODE_ENV: production
      DB_HOST: postgres
    ports:
      - '${BACKEND_PORT:-13333}:13333'
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/api/v1/health/ready'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  wecom-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    command: ['node', 'ace', 'wecom:bot']
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  feishu-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    command: ['node', 'ace', 'feishu:bot']
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  dingtalk-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    command: ['node', 'ace', 'dingtalk:bot']
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    ports:
      - '${FRONTEND_PORT:-18080}:18080'
    env_file:
      - ../apps/frontend/.env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:

name: api-starter-kit

services:
  postgres:
    image: pgvector/pgvector:pg15
    env_file:
      - ../apps/backend/.env
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    command:
      - sh
      - -c
      - export POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD" POSTGRES_DB="$$DB_DATABASE" && exec docker-entrypoint.sh postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$DB_USER" -d "$$DB_DATABASE"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

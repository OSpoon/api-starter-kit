services:
  backend:
    image: ${BACKEND_IMAGE:-api-starter-kit-backend:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    env_file:
      - ../apps/backend/.env
    environment:
      HOST: 0.0.0.0
      MIGRATE: 'true'
      NODE_ENV: production
      DB_HOST: postgres
      AI_AGENT_SKILLS_DIR: /data/assistant-skills
    volumes:
      - assistant-skills:/data/assistant-skills
      - media-images:/app/storage/media
    ports:
      - '${BACKEND_PORT:-13333}:13333'
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/api/v1/health/ready'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  ai-automation-worker:
    image: ${BACKEND_IMAGE:-api-starter-kit-backend:latest}
    command: ['node', 'ace', 'ai:automation:worker']
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      AI_AGENT_SKILLS_DIR: /data/assistant-skills
    volumes:
      - assistant-skills:/data/assistant-skills
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-api-starter-kit-frontend:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_API_DOCS_URL: ${VITE_API_DOCS_URL:-}
        VITE_PLATFORM_NAME: ${VITE_PLATFORM_NAME:-}
        VITE_PLATFORM_TAGLINE: ${VITE_PLATFORM_TAGLINE:-}
    ports:
      - '${FRONTEND_PORT:-18080}:18080'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  assistant-skills:
  media-images:

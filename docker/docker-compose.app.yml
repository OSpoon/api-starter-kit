services:
  backend:
    image: ${BACKEND_IMAGE:-api-starter-kit-backend:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    env_file:
      - ../apps/backend/.env
    environment:
      HOST: 0.0.0.0
      MIGRATE: 'true'
      NODE_ENV: production
      DB_HOST: postgres
    ports:
      - '${BACKEND_PORT:-13333}:13333'
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/api/v1/health/ready'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-api-starter-kit-frontend:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-}
        VITE_MONITORING_PROJECT: ${VITE_MONITORING_PROJECT:-api-starter-kit}
    ports:
      - '${FRONTEND_PORT:-18080}:18080'
    env_file:
      - ../apps/frontend/.env
    depends_on:
      backend:
        condition: service_healthy

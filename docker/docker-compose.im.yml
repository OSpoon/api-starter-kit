services:
  wecom-bot:
    image: ${BACKEND_IMAGE:-api-starter-kit-backend:latest}
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      AI_AGENT_SKILLS_DIR: /data/assistant-skills
    volumes:
      - assistant-skills:/data/assistant-skills
    command: ['node', 'ace', 'wecom:bot']
    depends_on:
      backend:
        condition: service_healthy

  feishu-bot:
    image: ${BACKEND_IMAGE:-api-starter-kit-backend:latest}
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      AI_AGENT_SKILLS_DIR: /data/assistant-skills
    volumes:
      - assistant-skills:/data/assistant-skills
    command: ['node', 'ace', 'feishu:bot']
    depends_on:
      backend:
        condition: service_healthy

  dingtalk-bot:
    image: ${BACKEND_IMAGE:-api-starter-kit-backend:latest}
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      AI_AGENT_SKILLS_DIR: /data/assistant-skills
    volumes:
      - assistant-skills:/data/assistant-skills
    command: ['node', 'ace', 'dingtalk:bot']
    depends_on:
      backend:
        condition: service_healthy

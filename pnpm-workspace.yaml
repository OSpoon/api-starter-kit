packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@google/genai': true
  '@swc/core': true
  esbuild: true
  maplibre-gl: true
  msgpackr-extract: true
  protobufjs: true
  simple-git-hooks: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.32.2'
  - '@modelcontextprotocol/core@2.4.0'
  - '@modelcontextprotocol/server@2.4.0'
onlyBuiltDependencies:
  - maplibre-gl
  - simple-git-hooks
  - vue-demi

server {
  listen 18080;
  server_name _;

  include /etc/nginx/conf.d/spa-common.inc;

  # Update metadata must never be served from a stale cache.
  location = /pluginWebUpdateNotice/web_version_by_plugin.json {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }
}

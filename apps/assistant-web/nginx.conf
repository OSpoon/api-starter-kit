server {
  listen 18080;
  server_name _;

  include /etc/nginx/conf.d/spa-common.inc;

  location ~ ^/(?:embed|embed-error)$ {
    try_files /index.html =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control "no-store" always;
  }

  location = /widget.js {
    expires -1;
  }

  location ~* /pluginWebUpdateNotice/web_version_by_plugin\.json$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }
}

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 助手嵌入验证</title>
    <style>
      :root {
        color-scheme: light;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #172033;
        background: #f4f6fa;
      }
      body {
        margin: 0;
        padding: 48px 20px;
      }
      main {
        max-width: 680px;
        margin: auto;
        padding: 28px;
        border: 1px solid #dce2ec;
        border-radius: 16px;
        background: white;
        box-shadow: 0 12px 36px #17203312;
      }
      h1 {
        margin-top: 0;
      }
      p,
      label {
        color: #526079;
      }
      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #c8d0df;
        border-radius: 8px;
        font: inherit;
      }
      button {
        margin-top: 18px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #315bea;
        font: inherit;
        cursor: pointer;
      }
      pre {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        padding: 14px;
        border-radius: 8px;
        background: #f1f3f8;
      }
      #status {
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI 助手嵌入验证</h1>
      <p>填写已部署的 assistant-web 地址和网页嵌入 Key，页面会加载真实的 widget.js。</p>
      <p>本页只用于本地联调，不会保存 Key。默认地址适用于本地 assistant-web 开发服务器。</p>

      <form id="embed-form">
        <label for="assistant-origin">assistant-web 地址</label>
        <input id="assistant-origin" type="url" required />

        <label for="api-key">网页嵌入 API Key</label>
        <input id="api-key" type="password" autocomplete="off" required />

        <button type="submit">加载嵌入助手</button>
      </form>

      <p id="status" role="status">等待加载</p>
      <section id="snippet-section" hidden>
        <h2>当前嵌入代码</h2>
        <pre><code id="snippet"></code></pre>
        <button id="copy-snippet" type="button">复制代码</button>
      </section>
    </main>

    <script>
      const form = document.querySelector('#embed-form')
      const status = document.querySelector('#status')
      const snippetSection = document.querySelector('#snippet-section')
      const snippet = document.querySelector('#snippet')
      document.querySelector('#assistant-origin').value = window.location.origin

      form.addEventListener('submit', (event) => {
        event.preventDefault()
        document.querySelector('iframe[title="AI assistant"]')?.remove()
        document.querySelector('#assistant-widget-loader')?.remove()

        let assistantOrigin
        try {
          assistantOrigin = new URL(document.querySelector('#assistant-origin').value).origin
        } catch {
          status.textContent = '请输入有效的 assistant-web 地址。'
          return
        }

        const apiKey = document.querySelector('#api-key').value.trim()
        if (!apiKey) {
          status.textContent = '请输入网页嵌入 API Key。'
          return
        }

        const loader = document.createElement('script')
        loader.id = 'assistant-widget-loader'
        loader.async = true
        loader.src = `${assistantOrigin}/widget.js`
        loader.dataset.apiKey = apiKey
        loader.onload = () => {
          status.textContent = '嵌入脚本已加载；助手按钮应显示在页面右下角。'
        }
        loader.onerror = () => {
          status.textContent = '加载失败，请检查 assistant-web 地址和 widget.js 是否可访问。'
        }

        snippet.textContent = `<script async src="${loader.src}" data-api-key="${apiKey}"><\/script>`
        snippetSection.hidden = false
        status.textContent = '正在加载嵌入脚本…'
        document.head.append(loader)
      })

      document.querySelector('#copy-snippet').addEventListener('click', async () => {
        await navigator.clipboard.writeText(snippet.textContent)
        status.textContent = '嵌入代码已复制。'
      })
    </script>
  </body>
</html>
